[package]
name = "kekkai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
description = "Sandbox child processes on Linux and macOS: Landlock or Seatbelt filesystem allowlist, network gate, and resource limits."
keywords = ["sandbox", "landlock", "seccomp", "isolation", "linux"]
categories = ["os::linux-apis", "api-bindings"]
homepage = "https://github.com/Sannrox/kekkai"
documentation = "https://docs.rs/kekkai"

[[bin]]
name = "kekkai-probe"
path = "src/bin/kekkai-probe.rs"
doc = false
test = false
bench = false

[[bin]]
name = "kekkai-guest"
path = "src/bin/kekkai-guest.rs"
required-features = ["guest"]
doc = false
test = false
bench = false

[[bench]]
name = "overhead"
harness = false

[[example]]
name = "transform"
path = "../../examples/transform.rs"

[[example]]
name = "agent_shell"
path = "../../examples/agent_shell.rs"

[features]
default = []
tokio = ["dep:tokio"]
tracing = ["dep:tracing"]
guest = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, default-features = false, features = ["process", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "process", "time"] }
