name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python duckdb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$HOME/kekkai-py"
          "$HOME/kekkai-py/bin/pip" install duckdb==2.0.0
          echo "$HOME/kekkai-py/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Examples
        run: cargo build --locked --workspace --examples
      - name: Test
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features tokio
          cargo test --locked --workspace --features tracing
          cargo test --locked --workspace --features guest

  build-and-test-arm:
    name: Build & Test (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python duckdb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$HOME/kekkai-py"
          "$HOME/kekkai-py/bin/pip" install duckdb==2.0.0
          echo "$HOME/kekkai-py/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features tokio
          cargo test --locked --workspace --features tracing
          cargo test --locked --workspace --features guest

  build-and-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features tokio
          cargo test --locked --workspace --features tracing
          cargo test --locked --workspace --features guest

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/validate-workflow-skills.sh
