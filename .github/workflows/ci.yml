name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python duckdb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$HOME/kekkai-py"
          "$HOME/kekkai-py/bin/pip" install duckdb==2.0.0
          echo "$HOME/kekkai-py/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Examples
        run: cargo build --locked --workspace --examples
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        env:
          # Isolation tests fail here instead of skipping.
          KEKKAI_REQUIRE_ISOLATION: "1"
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features tokio
          cargo test --locked --workspace --features tracing
          cargo test --locked --workspace --features guest

  build-and-test-arm:
    name: Build & Test (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Python duckdb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$HOME/kekkai-py"
          "$HOME/kekkai-py/bin/pip" install duckdb==2.0.0
          echo "$HOME/kekkai-py/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --locked --workspace --all-targets
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        env:
          # Isolation tests fail here instead of skipping.
          KEKKAI_REQUIRE_ISOLATION: "1"
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features tokio
          cargo test --locked --workspace --features tracing
          cargo test --locked --workspace --features guest

  build-and-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features tokio
          cargo test --locked --workspace --features tracing
          cargo test --locked --workspace --features guest

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/validate-workflow-skills.sh

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - run: bash scripts/validate-release.sh

  # Public API of the library crates against the pull request base. Versions
  # are release-owned, so a pull request never bumps them: a reported break
  # passes only when the pull request is marked breaking (`type!:` subject or
  # a Breaking/Upgrade section) and labelled `risk:breaking`, which the
  # release manifest turns into a gate.
  semver:
    name: Semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          # Bump with the toolchain: each release reads a range of rustdoc JSON formats.
          tool: cargo-semver-checks@0.51.0
      - name: cargo-semver-checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Every workspace library crate, so a new crate is covered without editing this list.
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          mapfile -t packages < <(jq -r '.packages[] | select(any(.targets[]; .kind | index("lib"))) | .name' <<<"$metadata")
          # One run per package: only a package that reports a break can be
          # waived; a tool or build failure in any package stays red.
          broken=()
          for package in "${packages[@]}"; do
            # A crate added by this pull request has no baseline to compare.
            manifest="$(jq -r --arg p "$package" '.packages[] | select(.name == $p) | .manifest_path' <<<"$metadata")"
            if ! git cat-file -e "${BASE}:${manifest#"$PWD"/}" 2>/dev/null; then
              echo "::notice::${package} is new in this pull request; no baseline to check."
              continue
            fi
            # A renamed package has no same-name baseline either.
            base_name="$(git show "${BASE}:${manifest#"$PWD"/}" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer).get("package", {}).get("name", ""))')"
            if [[ "$base_name" != "$package" ]]; then
              echo "::warning::${package} was named ${base_name} at the base; no same-name baseline to check. Review its API by hand."
              continue
            fi
            rc=0
            out="$(cargo semver-checks --package "$package" --baseline-rev "$BASE" 2>&1)" || rc=$?
            echo "$out"
            [[ $rc -eq 0 ]] && continue
            if grep -qE 'semver requires new major version' <<<"$out"; then
              broken+=("$package")
            elif grep -qE 'semver requires new minor version' <<<"$out"; then
              # The unchanged version reads as a patch release, so compatible
              # additions such as deprecations report "minor"; they pass.
              echo "::notice::${package}: minor-level API change (compatible)."
            else
              echo "::error::cargo-semver-checks failed for ${package} without reporting an API break; see the log."
              exit "$rc"
            fi
          done
          [[ ${#broken[@]} -eq 0 ]] && exit 0
          echo "API break reported in: ${broken[*]}"
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Public API break accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::cargo-semver-checks found a public API break. Mark the pull request breaking (a 'type!:' title or a '## Breaking' section) and add the risk:breaking label, or keep the change compatible."
          exit 1
