name: Bench

on:
  pull_request:
  schedule:
    - cron: "12 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overhead:
    name: Sandbox overhead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Measure prepare/apply/spawn/finish
        run: |
          cargo bench --locked --bench overhead -- \
            --json \
            --check crates/kekkai/benches/baseline-linux-x86_64.json
