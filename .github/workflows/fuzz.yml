name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "42 4 * * 1"

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: cargo-fuzz (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz settings
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo +nightly fuzz run settings -- -max_total_time=20
      - name: Fuzz paths
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo +nightly fuzz run paths -- -max_total_time=20
